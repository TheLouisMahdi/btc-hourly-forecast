name: Weekly BTC model retraining

on:
  schedule:
    # Every Sunday at 03:47 UTC.
    - cron: "47 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-btc-retraining
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-github.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m pip install -e . --no-deps

      - name: Fetch 180 days and retrain
        run: python scripts/github_weekly_retrain.py

      - name: Publish latest model snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/push_snapshot_branch.sh model-state model-state-output
