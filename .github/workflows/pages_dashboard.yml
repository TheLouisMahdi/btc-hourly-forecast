# Visual contract v2 is verified against every generated Pages artifact before deployment.
name: Deploy BTC dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages_dashboard.yml"
      - "scripts/github_dashboard.py"
      - "scripts/github_pages_dashboard.py"
      - "scripts/github_boundary_dashboard.py"
      - "scripts/github_trade_dashboard.py"
      - "scripts/github_timing_dashboard.py"
      - "scripts/github_visual_dashboard.py"
      - "scripts/github_uncertainty_dashboard.py"
      - "scripts/github_common.py"
      - "pyproject.toml"
      - "requirements-github.txt"
  workflow_run:
    workflows: ["Hourly BTC forecast"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: btc-dashboard-pages-v3
  cancel-in-progress: false

jobs:
  render-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-github.txt

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m pip install -e . --no-deps

      - name: Restore forecast and trade ledger
        shell: bash
        run: |
          mkdir -p .github_state
          if git ls-remote --exit-code --heads origin forecast-state >/dev/null 2>&1; then
            git fetch origin forecast-state --depth=1
            git show origin/forecast-state:history.json > .github_state/history.json 2>/dev/null || printf '[]\n' > .github_state/history.json
            git show origin/forecast-state:latest.json > .github_state/latest.json 2>/dev/null || printf '{}\n' > .github_state/latest.json
            git show origin/forecast-state:trades.json > .github_state/trades.json 2>/dev/null || printf '[]\n' > .github_state/trades.json
          else
            printf '[]\n' > .github_state/history.json
            printf '{}\n' > .github_state/latest.json
            printf '[]\n' > .github_state/trades.json
          fi

      - name: Render canonical dashboard
        run: |
          python scripts/github_pages_dashboard.py --runtime-dir .dashboard_runtime
          python scripts/github_visual_dashboard.py
          python scripts/github_uncertainty_dashboard.py

      - name: Verify visual dashboard contract
        run: |
          python - <<'PY'
          from pathlib import Path

          document = Path("site/index.html").read_text(encoding="utf-8")
          required = (
              'data-market-ambience="v2"',
              'data-uncertainty-display="range-only-v1"',
              'id="themeToggle"',
              'class="ambient-coin coin-btc"',
              'class="ambient-coin coin-eth"',
              '@keyframes coin-drift',
              'btc-dashboard-theme',
              'Likely next-close range',
              'no exact close is published',
          )
          missing = [marker for marker in required if marker not in document]
          forbidden = (
              'Model-estimated next close',
              '<th>Expected close</th>',
          )
          present_forbidden = [marker for marker in forbidden if marker in document]
          if missing or present_forbidden:
              raise SystemExit(
                  f"Dashboard contract failed: missing={missing}, forbidden={present_forbidden}"
              )
          print("Visual and uncertainty dashboard contracts verified")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
