name: Temporary luxury dashboard validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-github.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m pip install -e . --no-deps
      - run: python -m compileall -q src scripts
      - run: |
          python -m unittest -v \
            tests.test_visual_dashboard \
            tests.test_elegant_chart_dashboard \
            tests.test_dashboard_orchestrator \
            tests.test_trade_dashboard \
            tests.test_resilience_dashboard
