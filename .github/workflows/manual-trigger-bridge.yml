# Scoped dispatch bridge for explicit operator-requested runs.
name: Dispatch BTC workflows
run-name: Dispatch BTC forecast and retraining

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/manual-trigger-bridge.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hourly forecast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run forecast.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Dispatch model retraining
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run retrain.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f trigger_reason=USER_REQUEST

      - name: Confirm dispatch requests
        run: echo "Forecast and retraining workflow dispatch requests submitted."
