name: Temporary dashboard deploy validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-github.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m pip install -e . --no-deps
      - run: python -m compileall -q src scripts
      - run: |
          mkdir -p .github_state
          git fetch origin forecast-state --depth=1
          git show origin/forecast-state:latest.json > .github_state/latest.json
          git show origin/forecast-state:history.json > .github_state/history.json
          git show origin/forecast-state:trades.json > .github_state/trades.json
          git show origin/forecast-state:chart_candles.json > .github_state/chart_candles.json
          python scripts/render_dashboard.py --runtime-dir .dashboard_runtime
      - run: |
          python - <<'PY'
          from pathlib import Path
          document = Path("site/index.html").read_text(encoding="utf-8")
          required = (
              'data-luxury-theme="v1"',
              'class="health-summary',
              'class="panel trade-assistant-panel"',
              'Model direction drives paper entries',
              'data-elegant-chart="v2"',
          )
          forbidden = (
              'data-market-ambience="v2"',
              'id="themeToggle"',
              'ambient-coin',
              '@keyframes coin-drift',
              'btc-dashboard-theme',
              'Position entries are precision-gated',
          )
          missing = [x for x in required if x not in document]
          present = [x for x in forbidden if x in document]
          if missing or present:
              raise SystemExit(f"render contract failed: missing={missing}, forbidden={present}")
          print("render contract verified")
          PY
