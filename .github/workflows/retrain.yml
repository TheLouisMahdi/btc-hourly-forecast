name: On-demand BTC model retraining
run-name: BTC model retraining · ${{ inputs.trigger_reason }}

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: Policy or manual reason for retraining
        required: true
        default: MANUAL_REQUEST
        type: string

permissions:
  contents: write

concurrency:
  group: on-demand-btc-retraining
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Show retraining reason
        env:
          RETRAIN_REASON: ${{ inputs.trigger_reason }}
        run: printf 'Retraining reason: %s\n' "$RETRAIN_REASON"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-github.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m pip install -e . --no-deps

      - name: Run quality tests
        run: python -m unittest discover -s tests -v

      - name: Restore incumbent champion
        shell: bash
        run: |
          mkdir -p incumbent-model-state
          if git ls-remote --exit-code --heads origin model-state >/dev/null 2>&1; then
            git fetch origin model-state --depth=1
            for file in latest.joblib latest_training_report.json latest_metrics.csv economic_validation.json model_metadata.json negative_memory.joblib negative_memory_report.json; do
              git show "origin/model-state:$file" > "incumbent-model-state/$file" 2>/dev/null || true
            done
          fi

      - name: Train and jointly validate challenger
        id: retraining
        shell: bash
        env:
          RETRAIN_TRIGGER_REASON: ${{ inputs.trigger_reason }}
        run: |
          set +e
          mkdir -p training-diagnostics-output
          python scripts/github_weekly_retrain.py \
            --incumbent-dir incumbent-model-state \
            > training-diagnostics-output/training.log 2>&1
          retrain_exit=$?
          status=PASS
          if [ "$retrain_exit" -ne 0 ]; then
            status=FAIL
          fi
          promotion=KEEP_INCUMBENT
          if [ -f model-state-output/promotion.json ]; then
            promotion=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("model-state-output/promotion.json")
          try:
              print(json.loads(path.read_text(encoding="utf-8")).get("decision", "KEEP_INCUMBENT"))
          except Exception:
              print("KEEP_INCUMBENT")
          PY
          )
          fi
          cp model-state-output/promotion.json training-diagnostics-output/ 2>/dev/null || true
          cp model-state-output/economic_validation.json training-diagnostics-output/ 2>/dev/null || true
          cp model-state-output/model_metadata.json training-diagnostics-output/ 2>/dev/null || true
          cp model-state-output/candidate_negative_memory_report.json training-diagnostics-output/ 2>/dev/null || true
          RETRAIN_EXIT="$retrain_exit" STATUS="$status" PROMOTION="$promotion" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "status": os.environ["STATUS"],
              "promotion": os.environ["PROMOTION"],
              "trigger_reason": os.environ.get("RETRAIN_TRIGGER_REASON"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "retrain_exit_code": int(os.environ["RETRAIN_EXIT"]),
          }
          Path("training-diagnostics-output/status.json").write_text(
              json.dumps(payload, indent=2), encoding="utf-8"
          )
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "promotion=$promotion" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish retraining diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/push_snapshot_branch.sh training-diagnostics training-diagnostics-output

      - name: Enforce retraining result
        if: steps.retraining.outputs.status != 'PASS'
        run: |
          cat training-diagnostics-output/training.log
          exit 1

      - name: Publish promoted champion and negative memory
        if: >-
          steps.retraining.outputs.status == 'PASS' &&
          steps.retraining.outputs.promotion == 'PROMOTE'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/push_snapshot_branch.sh model-state model-state-output

      - name: Keep incumbent champion
        if: >-
          steps.retraining.outputs.status == 'PASS' &&
          steps.retraining.outputs.promotion != 'PROMOTE'
        run: |
          echo "Challenger did not jointly pass the economic and sandwiched negative-memory promotion gates."
          cat model-state-output/promotion.json
