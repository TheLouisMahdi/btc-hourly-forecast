name: BTC SMA200 daily shadow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/sma200-daily-shadow
  schedule:
    - cron: "33 0 * * *"

permissions:
  contents: write

concurrency:
  group: btc-sma200-daily-shadow
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify deterministic SMA200 paper rules
        run: python -m unittest discover -s tests -p 'test_sma200_shadow.py' -v

  shadow:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore isolated SMA200 paper state
        shell: bash
        run: |
          mkdir -p .sma_shadow
          if git ls-remote --exit-code --heads origin sma-shadow-state >/dev/null 2>&1; then
            git fetch origin sma-shadow-state --depth=1
            for file in state.json latest.json trades.json history.json candles.json; do
              git show "origin/sma-shadow-state:$file" > ".sma_shadow/$file" 2>/dev/null || true
            done
          fi
      - name: Process latest completed UTC daily signal
        run: python scripts/sma200_shadow.py --state-dir .sma_shadow
      - name: Persist isolated shadow paper ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/push_snapshot_branch.sh sma-shadow-state .sma_shadow
