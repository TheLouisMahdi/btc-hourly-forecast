name: Temporary trader realism validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-github.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m pip install -e . --no-deps
      - run: python -m compileall -q src scripts
      - run: |
          python -m unittest -v \
            tests.test_strategy \
            tests.test_aggressive_risk_contract \
            tests.test_execution_path \
            tests.test_execution_entry \
            tests.test_trade_lifecycle \
            tests.test_policy_configuration \
            tests.test_active_position_contract \
            tests.test_trader_realism
