name: Paper trade policy attribution

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: policy-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-ledger-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate policy report
        uses: actions/checkout@v6

      - name: Checkout observed paper-trade snapshot (read-only)
        uses: actions/checkout@v6
        with:
          ref: forecast-state
          path: observed-state
          persist-credentials: false

      - name: Checkout baseline main source (read-only)
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install replay dependencies
        run: python -m pip install -r requirements-github.txt

      - name: Verify attribution and replay unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p test_paper_policy_attribution.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_recorded_exit_replay.py -v

      - name: Build immutable-source comparison report
        run: |
          python scripts/compare_observed_paper_trades.py \
            --trades observed-state/trades.json \
            --candles observed-state/chart_candles.json \
            --output attribution-report

      - name: Replay recorded entries with baseline and candidate exit code
        run: |
          PYTHONPATH=baseline-source/src python scripts/replay_recorded_exits.py \
            --trades observed-state/trades.json \
            --candles observed-state/chart_candles.json \
            --output attribution-report/baseline_exit_replay.json
          PYTHONPATH=src python scripts/replay_recorded_exits.py \
            --trades observed-state/trades.json \
            --candles observed-state/chart_candles.json \
            --output attribution-report/candidate_exit_replay.json
          PYTHONPATH=src python scripts/replay_recorded_exits.py \
            --baseline attribution-report/baseline_exit_replay.json \
            --candidate attribution-report/candidate_exit_replay.json \
            --output attribution-report/paired_exit_replay.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: observed-paper-policy-attribution
          path: attribution-report/
          if-no-files-found: error
          retention-days: 30
