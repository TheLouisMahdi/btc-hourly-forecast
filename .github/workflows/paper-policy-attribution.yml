name: Paper trade policy attribution

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: policy-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-ledger-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate policy report
        uses: actions/checkout@v6

      - name: Checkout observed paper-trade snapshot (read-only)
        uses: actions/checkout@v6
        with:
          ref: forecast-state
          path: observed-state
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify attribution unit tests
        run: python -m unittest discover -s tests -p test_paper_policy_attribution.py -v

      - name: Build immutable-source comparison report
        run: |
          python scripts/compare_observed_paper_trades.py \
            --trades observed-state/trades.json \
            --candles observed-state/chart_candles.json \
            --output attribution-report

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: observed-paper-policy-attribution
          path: attribution-report/
          if-no-files-found: error
          retention-days: 30
