name: Hourly BTC forecast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hourly_forecast.yml"
      - "src/**"
      - "scripts/github_hourly_forecast.py"
      - "scripts/github_common.py"
      - "config/**"
      - "requirements-github.txt"
      - "pyproject.toml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly BTC model retraining"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: hourly-btc-forecast
  cancel-in-progress: true

jobs:
  forecast:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-github.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m pip install -e . --no-deps

      - name: Restore forecast and trade ledger
        shell: bash
        run: |
          mkdir -p .github_state
          if git ls-remote --exit-code --heads origin forecast-state >/dev/null 2>&1; then
            git fetch origin forecast-state --depth=1
            git show origin/forecast-state:history.json > .github_state/history.json 2>/dev/null || printf '[]\n' > .github_state/history.json
            git show origin/forecast-state:latest.json > .github_state/latest.json 2>/dev/null || printf '{}\n' > .github_state/latest.json
            git show origin/forecast-state:trades.json > .github_state/trades.json 2>/dev/null || printf '[]\n' > .github_state/trades.json
          else
            printf '[]\n' > .github_state/history.json
            printf '{}\n' > .github_state/latest.json
            printf '[]\n' > .github_state/trades.json
          fi

      - name: Restore weekly batch model and negative memory
        shell: bash
        run: |
          mkdir -p .model_state
          if git ls-remote --exit-code --heads origin model-state >/dev/null 2>&1; then
            git fetch origin model-state --depth=1
            for file in latest.joblib latest_training_report.json latest_metrics.csv model_metadata.json negative_memory.joblib negative_memory_report.json; do
              git show "origin/model-state:${file}" > ".model_state/${file}" 2>/dev/null || rm -f ".model_state/${file}"
            done
          fi

      - name: Restore adaptive learners
        shell: bash
        run: |
          mkdir -p .adaptive_state
          if git ls-remote --exit-code --heads origin adaptive-state >/dev/null 2>&1; then
            git fetch origin adaptive-state --depth=1
            for file in adaptive_state.joblib price_adaptive_state.joblib trade_adaptive_state.joblib summary.json price_summary.json trade_summary.json; do
              git show "origin/adaptive-state:${file}" > ".adaptive_state/${file}" 2>/dev/null || rm -f ".adaptive_state/${file}"
            done
          fi

      - name: Run canonical adaptive target-stop cycle
        run: python scripts/github_hourly_forecast.py

      - name: Resolve secondary next-candle outcomes
        run: python scripts/github_dashboard.py

      - name: Persist forecast and trade ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/push_snapshot_branch.sh forecast-state .github_state

      - name: Persist adaptive learners
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/push_snapshot_branch.sh adaptive-state .adaptive_state
