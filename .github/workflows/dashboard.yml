name: Deploy BTC dashboard
run-name: Deploy no-ML BTC rules dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Hourly BTC forecast
      - BTC SMA200 daily shadow
      - BTC SMA200 forward execution audit
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: btc-rule-dashboard
  cancel-in-progress: false

jobs:
  render-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore isolated rule state
        shell: bash
        run: |
          mkdir -p .rule_state
          if git ls-remote --exit-code --heads origin rule-state >/dev/null 2>&1; then
            git fetch origin rule-state --depth=1
            for file in state.json candles.json latest.json history.json trades.json; do
              git show "origin/rule-state:$file" > ".rule_state/$file" 2>/dev/null || true
            done
          fi

      - name: Restore isolated SMA200 shadow state
        shell: bash
        run: |
          mkdir -p .sma_shadow
          if git ls-remote --exit-code --heads origin sma-shadow-state >/dev/null 2>&1; then
            git fetch origin sma-shadow-state --depth=1
            for file in state.json latest.json trades.json history.json candles.json; do
              git show "origin/sma-shadow-state:$file" > ".sma_shadow/$file" 2>/dev/null || true
            done
          fi

      - name: Restore forward SMA execution audit
        shell: bash
        run: |
          mkdir -p .sma_audit
          if git ls-remote --exit-code --heads origin sma-audit-state >/dev/null 2>&1; then
            git fetch origin sma-audit-state --depth=1
            for file in report.json snapshots.json executions.json; do
              git show "origin/sma-audit-state:$file" > ".sma_audit/$file" 2>/dev/null || true
            done
          fi

      - name: Render AI-free dashboard
        run: python scripts/render_rules_dashboard.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
