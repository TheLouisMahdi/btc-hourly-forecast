name: Hourly BTC forecast
run-name: BTC rule-based spot paper trader · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: hourly-btc-rule-based
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run offline rule-engine tests
        run: python -m unittest tests.test_rule_based -v

      - name: Restore isolated rule-only paper state
        shell: bash
        run: |
          mkdir -p .rule_state
          if git ls-remote --exit-code --heads origin rule-state >/dev/null 2>&1; then
            git fetch origin rule-state --depth=1
            for file in state.json candles.json latest.json history.json trades.json; do
              git show "origin/rule-state:$file" > ".rule_state/$file" 2>/dev/null || true
            done
          fi

      - name: Run deterministic BTC spot paper cycle
        run: python scripts/rule_based.py --state-dir .rule_state

      - name: Save isolated paper state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/push_snapshot_branch.sh rule-state .rule_state
