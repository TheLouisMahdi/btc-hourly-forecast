[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-hourly-regime-trader"
version = "2.1.0"
description = "One-hour BTC regime-event forecasting and fail-safe paper-trade decision system"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "requests>=2.31",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "gradio>=5.0",
  "plotly>=5.18",
]

[project.scripts]
btc-regime = "btc_ema_trader.cli:main"
btc-ema = "btc_ema_trader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
