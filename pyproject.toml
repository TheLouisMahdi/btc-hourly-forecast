[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-hourly-regime-trader"
version = "5.4.0"
description = "Adaptive BTC paper-trading research with causal breakout features, persistent target-stop positions and immutable outcome tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.8,<2",
  "requests>=2.31,<3",
  "PyYAML>=6.0,<7",
  "joblib>=1.3,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://thelouismahdi.github.io/btc-hourly-forecast/"
Repository = "https://github.com/TheLouisMahdi/btc-hourly-forecast"

[project.scripts]
btc-regime = "btc_ema_trader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"
}

[tool.setuptools.packages.find]
where = ["src"]
